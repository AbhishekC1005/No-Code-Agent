[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nocode-agent"
version = "1.0.0"
description = "Visual builder for LangGraph workflows. Generates and executes real LangGraph Python code."
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.0.5",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.2.5",
    "jinja2==3.1.6",
    "black==26.10.1",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "aiosqlite==0.21.0",
    "pydantic[email]==2.10.6",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "cryptography==44.0.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
openai = ["langchain-openai==0.3.6"]
anthropic = ["langchain-anthropic==0.3.7"]
ollama = ["langchain-ollama==0.2.3"]
mcp = ["langchain-mcp-adapters==0.1.0"]

[project.scripts]
nocode-agent = "nocode_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nocode_agent*"]

[tool.setuptools.package-data]
nocode_agent = ["static/**/*", "static/*"]
